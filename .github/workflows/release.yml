name: Release

on:
  workflow_dispatch:
    inputs:
      draft:
        description: Create the release as a draft
        type: boolean
        default: false
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Read version from Cargo.toml
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists. Bump the version in Cargo.toml first."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag"

  build:
    name: Build (x86_64-linux)
    needs: prepare
    # Oldest supported runner, so the binary links against an older glibc
    # and OpenSSL 3.0 and runs on more distros.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Package
        run: |
          name="steamframe-link-${{ needs.prepare.outputs.tag }}-x86_64-linux"
          mkdir -p "dist/$name"
          cp target/release/steamframe-link README.md "dist/$name/"
          [ -f LICENSE ] && cp LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          cp target/release/steamframe-link dist/steamframe-link-x86_64-linux
      - uses: actions/upload-artifact@v4
        with:
          name: release-x86_64-linux
          path: |
            dist/*.tar.gz
            dist/steamframe-link-x86_64-linux
          if-no-files-found: error

  release:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          flags=()
          [ "${{ inputs.draft }}" = "true" ] && flags+=(--draft)
          [ "${{ inputs.prerelease }}" = "true" ] && flags+=(--prerelease)
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            "${flags[@]}"
